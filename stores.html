<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- @include head -->
    <title>Store locator — 14 EL Arika megastores in Algeria</title>
    <meta name="description" content="Find your nearest EL Arika store: addresses, opening hours, services and directions in Alger, Oran, Constantine, Annaba, Sétif and more." />
  </head>
  <body>
    <!-- @include header -->

    <main id="main">
      <section class="relative overflow-hidden bg-[#1a1a1a] text-white" aria-labelledby="sl-title">
        <!-- ShaderGradient "dark" variant behind the header band -->
        <div class="absolute inset-0 opacity-90" data-island="shader-gradient" data-island-defer data-props='{"variant":"dark"}'><div data-island-root class="absolute inset-0"></div></div>
        <div class="relative container-x py-10 lg:py-14">
          <nav aria-label="Breadcrumb" class="text-[13px] text-white/80"><a href="index.html" class="hover:underline" data-i18n="bc.home">Home</a> / <span aria-current="page" data-i18n="sl.crumb">Stores</span></nav>
          <h1 id="sl-title" class="mt-3 text-white" data-i18n="st.title">Find your nearest store</h1>
          <p class="mt-2 text-lg text-white/90" data-i18n="sl.sub">14 megastores · open 7 days a week · free parking</p>
          <form class="mt-6 max-w-[640px] flex flex-col sm:flex-row gap-2 p-2" role="search" data-glass data-glass-radius="20" data-glass-tint=".14" data-glass-dark data-store-search>
            <label for="sl-q" class="sr-only" data-i18n="st.label">City or wilaya</label>
            <input id="sl-q" name="city" class="input flex-1 border-0" placeholder="City or wilaya (e.g. Oran)" data-i18n-placeholder="st.ph" autocomplete="off" />
            <button type="button" class="btn glass-button glass-button-pill glass-dark" data-locate>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
              <span class="glass-button-text" data-i18n="st.locate">Use my location</span>
            </button>
          </form>
        </div>
      </section>

      <div class="container-x py-8 grid lg:grid-cols-[420px_1fr] gap-6 items-start">
        <section aria-labelledby="list-title">
          <h2 id="list-title" class="font-bold" aria-live="polite"><span data-store-count>14</span> <span data-i18n="sl.found">stores</span></h2>
          <p class="text-sm text-muted-strong" data-geo-status role="status"></p>
          <ul class="mt-4 grid gap-3 lg:max-h-[calc(100vh-220px)] lg:overflow-y-auto lg:pe-2" data-store-list></ul>
        </section>
        <section class="lg:sticky lg:top-[150px]" aria-label="Map">
          <div class="relative rounded-card overflow-hidden border border-line bg-surface aspect-[4/3] lg:aspect-auto lg:h-[calc(100vh-190px)] min-h-[320px]">
            <iframe title="Store map" class="absolute inset-0 w-full h-full" loading="lazy" referrerpolicy="no-referrer-when-downgrade" data-map></iframe>
            <div class="absolute bottom-4 inset-x-4 sm:start-4 sm:end-auto sm:w-[360px] p-4" data-glass data-glass-radius="18" data-glass-tint=".8" data-map-card></div>
          </div>
        </section>
      </div>
    </main>

    <!-- @include footer -->
    <script type="module" src="/src/js/pages/stores.js"></script>
  </body>
</html>
